<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY POS</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#182033;--muted:#718096;--line:#e7eaf1;--accent:#635bdb;--accent2:#5148c8;--soft:#efeeff;--good:#13865b;--shadow:0 12px 35px rgba(26,35,65,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-weight:650;background:var(--accent);color:white}button:hover{background:var(--accent2)}button.secondary{background:#f0f1f7;color:#30384d}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:#fff0f0;color:#b83232}.hidden{display:none!important}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top right,#e5e3ff,transparent 38%),var(--bg)}.auth{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:850;letter-spacing:-.6px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:white;font-weight:900}.sub{color:var(--muted);margin:7px 0 24px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:700;color:#596276}.field input,.field select,.field textarea,input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);outline:none}.field input:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #635bdb18}.auth-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}.linkbtn{background:none;color:var(--accent);padding:4px 0}.hint{font-size:12px;color:var(--muted);margin-top:17px}.auth .primary{width:100%;margin-top:10px}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#171a2b;color:#e9eafa;padding:22px 16px;display:flex;flex-direction:column;gap:22px}.sidebar .brand{padding:0 9px;color:#fff}.sidebar .logo{background:#756df0}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#aeb2c8;text-align:left;padding:11px 13px;font-weight:600}.nav button.active,.nav button:hover{background:#2b2e46;color:#fff}.nav .nav-icon{display:inline-block;width:25px}.side-bottom{margin-top:auto;border-top:1px solid #34374c;padding-top:15px}.main{min-width:0;padding:25px 30px 45px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.topbar h1{font-size:25px;margin:0;letter-spacing:-.6px}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:39px;height:39px;border-radius:50%;object-fit:cover;background:#e7e5ff;display:grid;place-items:center;color:var(--accent);font-weight:800;border:1px solid var(--line)}.profile-mini{display:flex;align-items:center;gap:9px}.profile-mini small{display:block;color:var(--muted)}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:0 3px 15px rgba(20,30,60,.025)}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:27px;font-weight:800;margin-top:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 15px}.section-head h2{font-size:19px;margin:0}.muted{color:var(--muted)}.two-col{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}.product-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.product{overflow:hidden;padding:0}.product-img{height:125px;background:linear-gradient(135deg,#f0efff,#e9f4ff);display:grid;place-items:center;font-size:42px}.product-body{padding:14px}.product-body h3{margin:0 0 4px;font-size:15px}.price{font-weight:800;margin:7px 0 12px}.qty{display:flex;align-items:center;gap:9px}.qty button{padding:5px 10px}.cart-line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.cart-line:last-child{border:0}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:850;padding:15px 0}.pay-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pay-option{background:var(--panel);border:1.5px solid var(--line);color:var(--text);padding:13px}.pay-option.selected{border-color:var(--accent);background:var(--soft);color:var(--accent)}.delivery{display:flex;gap:9px;flex-wrap:wrap}.delivery button{background:#f1f2f8;color:#414960}.delivery button.selected{background:var(--soft);color:var(--accent);outline:1px solid var(--accent)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.empty{padding:28px;text-align:center;color:var(--muted)}.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.profile-box{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.profile-large{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#eceaff;display:grid;place-items:center;font-size:28px;color:var(--accent)}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#eef8f3;color:var(--good);font-size:12px;font-weight:700}.notice{background:#fff8e8;border:1px solid #f5e4b7;padding:12px 14px;border-radius:12px;color:#795b17;font-size:13px;margin-top:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20243a;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20}.modal-back{position:fixed;inset:0;background:#10142688;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:var(--panel);border-radius:18px;padding:23px;width:min(440px,100%);box-shadow:var(--shadow)}.modal h3{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.mobile-menu{display:none}
body.dark{--bg:#111421;--panel:#1c2131;--text:#edf0fa;--muted:#a0a8bd;--line:#343b50;--soft:#302d53;--shadow:0 12px 35px #0004}body.dark .secondary,body.dark .ghost,body.dark .delivery button{background:#2a3042;color:#e6e9f5}body.dark .product-img{background:linear-gradient(135deg,#30304d,#26384a)}body.dark .pay-option{background:var(--panel);color:var(--text)}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:5;padding:10px 12px;flex-direction:row;align-items:center;overflow:auto}.sidebar .brand{font-size:17px}.sidebar .logo{width:34px;height:34px}.nav{display:flex;gap:3px}.nav button{white-space:nowrap;padding:9px}.nav .nav-icon{width:auto;margin-right:5px}.side-bottom{display:none}.main{padding:20px 16px}.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}
@media(max-width:520px){.topbar{align-items:flex-start}.topbar h1{font-size:21px}.profile-mini span{display:none}.settings-grid{grid-template-columns:1fr}.stats{gap:10px}.stat-value{font-size:23px}.auth{padding:23px}}
</style>
</head>
<body>
<div id="authScreen" class="auth-wrap">
  <div class="auth">
    <div class="brand"><div class="logo">M</div> MY POS</div>
    <p class="sub" id="authSubtitle">Conectează-te în contul magazinului tău.</p>
    <div id="loginForm">
      <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" placeholder="nume@exemplu.ro" autocomplete="username"></div>
      <div class="field"><label for="loginPass">Parolă</label><input id="loginPass" type="password" placeholder="Parola ta" autocomplete="current-password"></div>
      <button class="primary" onclick="login()">Intră în cont</button>
      <div class="auth-actions"><button class="linkbtn" onclick="showHelp()">Ajutor</button><button class="linkbtn" onclick="showForgot()">Ai uitat parola?</button></div>
      <p class="hint">Nu ai cont? <button class="linkbtn" onclick="toggleAuth(true)">Creează un cont</button></p>
    </div>
    <div id="registerForm" class="hidden">
      <div class="field"><label for="regName">Nume</label><input id="regName" placeholder="Numele tău" autocomplete="name"></div>
      <div class="field"><label for="regEmail">E-mail</label><input id="regEmail" type="email" placeholder="nume@exemplu.ro" autocomplete="email"></div>
      <div class="field"><label for="regPass">Parolă</label><input id="regPass" type="password" placeholder="Alege o parolă" autocomplete="new-password"></div>
      <button class="primary" onclick="register()">Creează contul</button>
      <p class="hint">Ai deja cont? <button class="linkbtn" onclick="toggleAuth(false)">Intră în cont</button></p>
    </div>
    <div class="notice">Versiune demo: contul și datele sunt păstrate doar în acest browser. Nu folosi o parolă importantă.</div>
  </div>
</div>
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo">M</div> MY POS</div>
    <nav class="nav" id="nav">
      <button class="active" data-page="Panou"><span class="nav-icon">▦</span>Panou</button>
      <button data-page="Conversație"><span class="nav-icon">☏</span>Conversație</button>
      <button data-page="E-mail"><span class="nav-icon">✉</span>E-mail</button>
      <button data-page="Comenzi"><span class="nav-icon">▤</span>Comenzi</button>
      <button data-page="Clienți"><span class="nav-icon">♙</span>Clienți</button>
      <button data-page="Cumpărare"><span class="nav-icon">🛒</span>Cumpărare</button>
      <button data-page="Istoric"><span class="nav-icon">◷</span>Istoric</button>
      <button data-page="Rapoarte"><span class="nav-icon">▥</span>Rapoarte</button>
    </nav>
    <div class="side-bottom"><button class="ghost" style="width:100%;border-color:#44485f;color:#d8daf0" onclick="showPage('Setări')">⚙ Setări</button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">Panou</h1><div class="muted" id="todayLabel">Bine ai venit în MY POS</div></div>
      <div class="top-actions"><button class="ghost" onclick="showPage('Setări')">⚙</button><div class="profile-mini" onclick="showPage('Profil')" style="cursor:pointer"><img class="avatar" id="topAvatar" alt="Avatar" src=""><span><b id="topName">Cont demo</b><small>Profil</small></span></div></div>
    </header>
    <section id="pageContent"></section>
  </main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:'RON'}).format(Number(n)||0);
const defaultProducts=[{id:1,name:'Cafea',price:12,emoji:'☕'},{id:2,name:'Apă',price:5,emoji:'💧'},{id:3,name:'Sandviș',price:18,emoji:'🥪'},{id:4,name:'Suc',price:8,emoji:'🧃'},{id:5,name:'Caiet',price:12,emoji:'📒'},{id:6,name:'Cană',price:15,emoji:'☕'}];
let user=null,cart={},payment='cash',delivery=0;
let data=JSON.parse(localStorage.getItem('mypos_data')||'null')||{products:defaultProducts,orders:[],customers:[],settings:{shop:'MY POS',currency:'RON',dark:false,deliveryOptions:[10,15]},emails:[],messages:[],profilePhoto:''};
function save(){localStorage.setItem('mypos_data',JSON.stringify(data))}
function toast(msg){$('toastRoot').innerHTML='<div class="toast">'+msg+'</div>';setTimeout(()=>$('toastRoot').innerHTML='',2600)}
function toggleAuth(reg){$('loginForm').classList.toggle('hidden',reg);$('registerForm').classList.toggle('hidden',!reg);$('authSubtitle').textContent=reg?'Creează un cont demo.':'Conectează-te în contul magazinului tău.'}
function register(){let name=$('regName').value.trim(),email=$('regEmail').value.trim().toLowerCase(),pass=$('regPass').value;if(!name||!email||!pass){toast('Completează toate câmpurile.');return}if(pass.length<4){toast('Parola trebuie să aibă cel puțin 4 caractere.');return}let users=JSON.parse(localStorage.getItem('mypos_users')||'[]');if(users.some(u=>u.email===email)){toast('Există deja un cont cu acest e-mail.');return}users.push({name,email,pass});localStorage.setItem('mypos_users',JSON.stringify(users));toast('Cont demo creat. Acum intră în cont.');toggleAuth(false);$('loginEmail').value=email;$('loginPass').value=''}
function login(){let email=$('loginEmail').value.trim().toLowerCase(),pass=$('loginPass').value;let users=JSON.parse(localStorage.getItem('mypos_users')||'[]');let found=users.find(u=>u.email===email&&u.pass===pass);if(!found){toast('E-mail sau parolă incorectă.');return}user=found;startApp()}
function startApp(){$('authScreen').classList.add('hidden');$('app').classList.remove('hidden');$('topName').textContent=user.name;$('topAvatar').src=data.profilePhoto||avatarData();$('todayLabel').textContent='Bine ai venit, '+user.name;document.body.classList.toggle('dark',!!data.settings.dark);showPage('Panou')}
function logout(){user=null;$('app').classList.add('hidden');$('authScreen').classList.remove('hidden');$('loginPass').value=''}
function avatarData(){return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="50" fill="#e7e5ff"/><text x="50" y="62" font-size="45" text-anchor="middle" fill="#635bdb">☺</text></svg>')}
function showHelp(){modal('Ajutor la conectare','Introdu e-mailul și parola folosite la înregistrare, apoi apasă „Intră în cont”. Dacă nu ai cont, alege „Creează un cont”. Datele demo sunt păstrate în browserul acesta.', '<button onclick="closeModal()">Am înțeles</button>')}
function showForgot(){modal('Ai uitat parola?','Aceasta este o versiune demo și nu trimite e-mailuri reale. Pentru test, poți crea un cont nou cu o adresă de e-mail diferită sau poți cere administratorului aplicației resetarea contului.', '<button class="secondary" onclick="closeModal()">Închide</button>')}
function modal(title,body,actions){$('modalRoot').innerHTML='<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>'+title+'</h3><p class="muted">'+body+'</p><div class="modal-actions">'+actions+'</div></div></div>'}
function closeModal(){$('modalRoot').innerHTML=''}
function showPage(page){$('pageTitle').textContent=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='Panou')html=dashboard();if(page==='Cumpărare')html=buyPage();if(page==='Comenzi')html=ordersPage();if(page==='Clienți')html=customersPage();if(page==='Istoric')html=historyPage();if(page==='Rapoarte')html=reportsPage();if(page==='Setări')html=settingsPage();if(page==='Profil')html=profilePage();if(page==='Conversație')html=chatPage();if(page==='E-mail')html=emailPage();$('pageContent').innerHTML=html}
$('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)showPage(b.dataset.page)});
function dashboard(){let total=data.orders.reduce((s,o)=>s+o.total,0);return `<div class="grid stats"><div class="card"><div class="stat-label">Vânzări totale</div><div class="stat-value">${money(total)}</div></div><div class="card"><div class="stat-label">Comenzi</div><div class="stat-value">${data.orders.length}</div></div><div class="card"><div class="stat-label">Produse</div><div class="stat-value">${data.products.length}</div></div><div class="card"><div class="stat-label">Clienți</div><div class="stat-value">${data.customers.length}</div></div></div><div class="card"><div class="section-head"><h2>Activitate recentă</h2><button class="secondary" onclick="showPage('Cumpărare')">＋ Vânzare nouă</button></div>${data.orders.length?ordersTable(data.orders.slice(-5).reverse()):'<div class="empty">Nu există încă vânzări. Începe din secțiunea Cumpărare.</div>'}</div>`}
function buyPage(){let items=Object.entries(cart).filter(([id,q])=>q>0).map(([id,q])=>({p:data.products.find(p=>p.id==id),q})).filter(x=>x.p);let subtotal=items.reduce((s,x)=>s+x.p.price*x.q,0),total=subtotal+delivery;return `<div class="grid two-col"><div><div class="section-head"><h2>Produse</h2><span class="muted">${data.products.length} disponibile</span></div><div class="grid product-grid">${data.products.map(p=>`<div class="card product"><div class="product-img">${p.emoji||'📦'}</div><div class="product-body"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><div class="qty"><button onclick="changeQty(${p.id},-1)" class="secondary">−</button><b>${cart[p.id]||0}</b><button onclick="changeQty(${p.id},1)">+</button></div></div></div>`).join('')}</div></div><aside class="card"><div class="section-head"><h2>Coșul tău</h2><button class="linkbtn" onclick="cart={};showPage('Cumpărare')">Golește</button></div>${items.length?items.map(x=>`<div class="cart-line"><span>${esc(x.p.name)} × ${x.q}</span><b>${money(x.p.price*x.q)}</b></div>`).join(''):'<div class="empty">Coșul este gol.</div>'}<div class="total"><span>Subtotal</span><span>${money(subtotal)}</span></div><div class="field"><label>Cost livrare</label><div class="delivery">${data.settings.deliveryOptions.map(v=>`<button class="${delivery===v?'selected':''}" onclick="setDelivery(${v})">+${v} lei</button>`).join('')}</div><small class="muted">Dacă nu alegi o opțiune, costul este 0 lei.</small></div><div class="total"><span>Total</span><span>${money(total)}</span></div><div class="field"><label>Metoda de plată</label><div class="pay-options"><button class="pay-option ${payment==='cash'?'selected':''}" onclick="setPayment('cash')">💵 Cash</button><button class="pay-option ${payment==='card'?'selected':''}" onclick="setPayment('card')">💳 Card</button></div></div><button style="width:100%;margin-top:10px" onclick="checkout()">Finalizează cumpărarea</button><p class="hint">Plățile sunt demonstrative; nu se încasează bani reali.</p></aside></div>`}
function changeQty(id,delta){cart[id]=Math.max(0,(cart[id]||0)+delta);if(!cart[id])delete cart[id];showPage('Cumpărare')}
function setDelivery(v){delivery=v;showPage('Cumpărare')}
function setPayment(v){payment=v;showPage('Cumpărare')}
function checkout(){let items=Object.entries(cart).filter(([id,q])=>q>0).map(([id,q])=>{let p=data.products.find(x=>x.id==id);return p?{name:p.name,price:p.price,qty:q}:null}).filter(Boolean);if(!items.length){toast('Adaugă produse în coș.');return}let subtotal=items.reduce((s,x)=>s+x.price*x.qty,0),order={id:Date.now(),date:new Date().toLocaleString('ro-RO'),items,subtotal,delivery,total:subtotal+delivery,payment:payment==='cash'?'Cash':'Card'};data.orders.push(order);save();cart={};delivery=0;toast('Comanda demo a fost înregistrată!');showPage('Comenzi')}
function ordersTable(orders){return `<div class="table-wrap"><table><thead><tr><th>Comandă</th><th>Data</th><th>Total</th><th>Plată</th></tr></thead><tbody>${orders.map(o=>`<tr><td>#${String(o.id).slice(-5)}</td><td>${o.date}</td><td><b>${money(o.total)}</b></td><td>${o.payment}</td></tr>`).join('')}</tbody></table></div>`}
function ordersPage(){return `<div class="card"><div class="section-head"><h2>Toate comenzile</h2><button onclick="showPage('Cumpărare')">＋ Comandă nouă</button></div>${data.orders.length?ordersTable([...data.orders].reverse()):'<div class="empty">Nu există comenzi încă.</div>'}</div>`}
function customersPage(){return `<div class="card"><div class="section-head"><h2>Clienți</h2><button onclick="addCustomer()">＋ Adaugă client</button></div>${data.customers.length?`<div class="table-wrap"><table><thead><tr><th>Nume</th><th>E-mail</th></tr></thead><tbody>${data.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nu ai adăugat clienți.</div>'}</div>`}
function addCustomer(){modal('Client nou','<input id="cName" placeholder="Nume client"><br><br><input id="cEmail" placeholder="E-mail client">','<button class="secondary" onclick="closeModal()">Anulează</button><button onclick="saveCustomer()">Salvează</button>')}
function saveCustomer(){let name=$('cName').value.trim(),email=$('cEmail').value.trim();if(!name){toast('Introdu numele clientului.');return}data.customers.push({name,email});save();closeModal();showPage('Clienți')}
function historyPage(){return `<div class="card"><h2>Istoric vânzări</h2>${data.orders.length?ordersTable([...data.orders].reverse()):'<div class="empty">Istoricul este gol.</div>'}</div>`}
function reportsPage(){let total=data.orders.reduce((s,o)=>s+o.total,0),cash=data.orders.filter(o=>o.payment==='Cash').reduce((s,o)=>s+o.total,0),card=total-cash;return `<div class="grid stats"><div class="card"><div class="stat-label">Încasări demo</div><div class="stat-value">${money(total)}</div></div><div class="card"><div class="stat-label">Cash</div><div class="stat-value">${money(cash)}</div></div><div class="card"><div class="stat-label">Card</div><div class="stat-value">${money(card)}</div></div><div class="card"><div class="stat-label">Comenzi</div><div class="stat-value">${data.orders.length}</div></div></div><div class="card"><h2>Raport</h2><p class="muted">Valorile sunt calculate din comenzile demonstrative înregistrate în această aplicație.</p></div>`}
function settingsPage(){return `<div class="grid settings-grid"><div class="card"><h2>Date magazin</h2><div class="field"><label>Numele magazinului</label><input id="shopName" value="${esc(data.settings.shop)}"></div><div class="field"><label>Monedă</label><input value="Lei (RON)" disabled></div><button onclick="saveShop()">Salvează</button></div><div class="card"><h2>Cost livrare</h2><p class="muted">Alege cele două opțiuni disponibile în Cumpărare.</p><div class="field"><label>Prima opțiune (lei)</label><input id="delivery1" type="number" min="1" value="${data.settings.deliveryOptions[0]}"></div><div class="field"><label>A doua opțiune (lei)</label><input id="delivery2" type="number" min="1" value="${data.settings.deliveryOptions[1]}"></div><button onclick="saveDelivery()">Salvează costurile</button></div><div class="card"><h2>Aspect</h2><p class="muted">Alege tema aplicației.</p><button class="secondary" onclick="toggleTheme()">☼ / ☾ Schimbă tema</button></div><div class="card"><h2>Administrare produse</h2><p class="muted">Adaugă produse noi în catalogul magazinului.</p><div class="field"><label>Nume produs</label><input id="newProductName" placeholder="Ex. Ciocolată"></div><div class="field"><label>Preț (lei)</label><input id="newProductPrice" type="number" min="0.01" step="0.01" placeholder="10"></div><button onclick="addProduct()">＋ Adaugă produs</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0">${data.products.map(p=>`<div class="cart-line"><span>${p.emoji||'📦'} ${esc(p.name)} · ${money(p.price)}</span><button class="danger" onclick="deleteProduct(${p.id})">Șterge</button></div>`).join('')}</div><div class="card"><h2>Backup</h2><p class="muted">Descarcă o copie a produselor, comenzilor și setărilor.</p><button class="secondary" onclick="backup()">Descarcă backup</button></div><div class="card"><h2>Sesiune</h2><p class="muted">Ieși din contul demo de pe acest dispozitiv.</p><button class="danger" onclick="logout()">Deconectare</button></div></div>`}
function saveShop(){data.settings.shop=$('shopName').value.trim()||'MY POS';save();toast('Setările au fost salvate.')}
function saveDelivery(){let a=Number($('delivery1').value),b=Number($('delivery2').value);if(a<=0||b<=0||a===b){toast('Introdu două valori pozitive și diferite.');return}data.settings.deliveryOptions=[a,b];save();toast('Costurile de livrare au fost salvate.')}
function toggleTheme(){data.settings.dark=!data.settings.dark;document.body.classList.toggle('dark',data.settings.dark);save();toast('Aspectul a fost schimbat.')}
function addProduct(){let name=$('newProductName').value.trim(),price=Number($('newProductPrice').value);if(!name||price<=0){toast('Completează numele și un preț valid.');return}data.products.push({id:Date.now(),name,price,emoji:'📦'});save();showPage('Setări');toast('Produs adăugat.')}
function deleteProduct(id){data.products=data.products.filter(p=>p.id!==id);delete cart[id];save();showPage('Setări');toast('Produs șters.')}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-pos-backup.json';a.click();URL.revokeObjectURL(url)}
function profilePage(){return `<div class="card"><h2>Profilul meu</h2><div class="profile-box"><img class="profile-large" id="profilePreview" src="${data.profilePhoto||avatarData()}" alt="Poza de profil"><div><h3>${esc(user.name)}</h3><p class="muted">${esc(user.email)}</p><label class="pill" for="photoInput" style="cursor:pointer">Editează poza</label><input id="photoInput" type="file" accept="image/*" class="hidden" onchange="previewPhoto(event)"><button class="secondary" onclick="removePhoto()">Elimină poza</button></div></div><p class="hint">Alege o fotografie din telefon sau calculator. Poza se salvează local în browser.</p></div>`}
function previewPhoto(e){let file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){toast('Alege o imagine mai mică de 2 MB.');return}let reader=new FileReader();reader.onload=()=>{data.profilePhoto=reader.result;save();$('profilePreview').src=reader.result;$('topAvatar').src=reader.result;toast('Poza de profil a fost salvată.')};reader.readAsDataURL(file)}
function removePhoto(){data.profilePhoto='';save();$('profilePreview').src=avatarData();$('topAvatar').src=avatarData();toast('Poza implicită a fost restaurată.')}
function chatPage(){return `<div class="card"><h2>Conversație</h2><p class="muted">Mesaje demonstrative pentru comunicarea cu clienții.</p><div id="chatMessages">${data.messages.map(m=>`<p><b>${esc(m.from)}:</b> ${esc(m.text)}</p>`).join('')||'<p class="muted">Nu există mesaje.</p>'}</div><div class="field"><label>Mesaj nou</label><input id="chatInput" placeholder="Scrie un mesaj..."></div><button onclick="sendMessage()">Trimite</button></div>`}
function sendMessage(){let text=$('chatInput').value.trim();if(!text)return;data.messages.push({from:user.name,text});save();showPage('Conversație')}
function emailPage(){return `<div class="card"><h2>E-mail</h2><p class="muted">Mesaje demonstrative. Această secțiune nu este conectată la Gmail și nu trimite e-mailuri reale.</p><div class="field"><label>Destinatar</label><input id="mailTo" type="email" placeholder="client@exemplu.ro"></div><div class="field"><label>Subiect</label><input id="mailSubject" placeholder="Subiectul mesajului"></div><div class="field"><label>Mesaj</label><textarea id="mailBody" rows="4" placeholder="Scrie mesajul..."></textarea></div><button onclick="sendEmail()">Salvează mesajul demo</button><h3>Mesaje salvate</h3>${data.emails.map(m=>`<div class="cart-line"><span><b>${esc(m.subject)}</b><br><small class="muted">Către: ${esc(m.to)}</small></span><span class="pill">Demo</span></div>`).join('')||'<p class="empty">Nu ai mesaje salvate.</p>'}</div>`}
function sendEmail(){let to=$('mailTo').value.trim(),subject=$('mailSubject').value.trim(),body=$('mailBody').value.trim();if(!to||!subject||!body){toast('Completează toate câmpurile.');return}data.emails.push({to,subject,body});save();showPage('E-mail');toast('Mesaj demo salvat.')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
